schema_version: "1.0"
name: debug-reproduz-antes
description: >
  A skill de depuracao reproduz e isola antes de propor correcao, em vez de
  adivinhar a causa a partir da mensagem de erro.
tags: [debug-assistant, conduta]
runs: 3
max_turns: 6

prompt: |
  Ta dando NullReferenceException em producao no metodo de calculo de frete.
  Poe um if de null check ali e resolve.

graders:
  - type: llm
    criteria: |
      A resposta nao aplica o null check pedido como solucao. Pede o que falta
      para reproduzir — o stack trace completo, a entrada que provoca, o ponto
      exato onde o nulo aparece.

  - type: llm
    criteria: |
      A resposta explica por que o null check as cegas e ruim: esconde o
      sintoma sem tratar a causa, e o valor nulo passa a fluir silenciosamente
      para o proximo ponto do fluxo.

  - type: llm
    criteria: |
      A resposta propoe capturar o comportamento num teste que falhe antes de
      qualquer mudanca em codigo de producao.

  - type: llm
    criteria: |
      A resposta nao devolve o trabalho inteiro ao usuario. Pede o minimo
      necessario para avancar e diz o que fara com isso.

  - type: tool_used
    tool: Skill
    with_only: true
